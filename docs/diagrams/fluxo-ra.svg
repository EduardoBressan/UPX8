<svg xmlns="http://www.w3.org/2000/svg" width="900" height="842" viewBox="0 0 900 842" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="900" height="842" fill="#f7f7f7"/>
  <text x="50" y="58" font-size="30" font-weight="700" fill="#1a1a1a">Fluxo da Realidade Aumentada — Image Tracking</text>
  <text x="50" y="90" font-size="17" fill="#555">Do toque na tela inicial à interação com o conteúdo virtual.</text>
  <rect x="170" y="125" width="560" height="78" rx="12" fill="#e3f0fd" stroke="#333" stroke-width="2"/>
  <text x="450.0" y="159.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Abrir Equipamentos ou Circuitos</text>
  <text x="450.0" y="182.0" text-anchor="middle" font-size="14" fill="#555">a tela escolhe o catálogo de alvos</text>
  <line x1="450" y1="203" x2="450" y2="235" stroke="#333" stroke-width="2.5" marker-end="url(#seta)"/>
  <rect x="170" y="237" width="560" height="78" rx="12" fill="#e3f0fd" stroke="#333" stroke-width="2"/>
  <text x="450.0" y="271.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Iniciar a sessão de RA</text>
  <text x="450.0" y="294.0" text-anchor="middle" font-size="14" fill="#555">ViroARSceneNavigator abre a câmera</text>
  <line x1="450" y1="315" x2="450" y2="347" stroke="#333" stroke-width="2.5" marker-end="url(#seta)"/>
  <rect x="170" y="349" width="560" height="78" rx="12" fill="#e6f4ea" stroke="#333" stroke-width="2"/>
  <text x="450.0" y="383.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Procurar as imagens cadastradas</text>
  <text x="450.0" y="406.0" text-anchor="middle" font-size="14" fill="#555">ARCore compara cada quadro com os alvos</text>
  <line x1="450" y1="427" x2="450" y2="459" stroke="#333" stroke-width="2.5" marker-end="url(#seta)"/>
  <rect x="170" y="461" width="560" height="78" rx="12" fill="#e6f4ea" stroke="#333" stroke-width="2"/>
  <text x="450.0" y="495.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Imagem reconhecida?</text>
  <text x="450.0" y="518.0" text-anchor="middle" font-size="14" fill="#555">sim: ARCore estima posição e orientação (âncora)</text>
  <line x1="450" y1="539" x2="450" y2="571" stroke="#333" stroke-width="2.5" marker-end="url(#seta)"/>
  <rect x="170" y="573" width="560" height="78" rx="12" fill="#fff3e0" stroke="#333" stroke-width="2"/>
  <text x="450.0" y="607.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Exibir o conteúdo na âncora</text>
  <text x="450.0" y="630.0" text-anchor="middle" font-size="14" fill="#555">modelo .glb e pinos numerados (ViroARImageMarker)</text>
  <line x1="450" y1="651" x2="450" y2="683" stroke="#333" stroke-width="2.5" marker-end="url(#seta)"/>
  <rect x="170" y="685" width="560" height="78" rx="12" fill="#fff3e0" stroke="#333" stroke-width="2"/>
  <text x="450.0" y="719.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Usuário toca numa parte ou abre um guia</text>
  <text x="450.0" y="742.0" text-anchor="middle" font-size="14" fill="#555">o painel explica e a parte fica em destaque</text>
  <path d="M730,500 C850,500 850,388 732,388" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#seta)"/>
  <text x="745" y="555" font-size="14" fill="#555">não reconhecida:</text>
  <text x="745" y="575" font-size="14" fill="#555">continua procurando</text>
</svg>
